version: '3.9'
services:
  account-service:
    build: { context: ., dockerfile: account-service/Dockerfile }
    ports: ["8443:8443"]
    networks: [banking-net]
  customer-service:
    build: { context: ., dockerfile: customer-service/Dockerfile }
    ports: ["8453:8453"]
    networks: [banking-net]
  payment-service:
    build: { context: ., dockerfile: payment-service/Dockerfile }
    ports: ["8082:8082"]
    environment:
      - SERVICES_ACCOUNT-SERVICE_URL=https://account-service:8443
      - SERVICES_CUSTOMER-SERVICE_URL=https://customer-service:8453
    depends_on: [account-service, customer-service]
    networks: [banking-net]
networks:
  banking-net:
    driver: bridge
